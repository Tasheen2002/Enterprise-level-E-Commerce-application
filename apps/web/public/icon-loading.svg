<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      transform-origin: 16px 16px;
      animation: spin 1s linear infinite;
    }
  </style>
  <circle cx="16" cy="16" r="15" fill="#231E19" stroke="#353025" stroke-width="1"/>
  <circle cx="16" cy="16" r="13" fill="none" stroke="#C9A961" stroke-width="2" stroke-dasharray="20 40" class="spinner" />
  <text x="16" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#F5F1E9" text-anchor="middle">S</text>
</svg>
