version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: slipperze-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: slipperze_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: slipperze-api
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:test_password@postgres:5432/slipperze_dev?schema=public
      - JWT_SECRET=your-jwt-secret-key-change-in-prod
    depends_on:
      - postgres

volumes:
  postgres_data:
