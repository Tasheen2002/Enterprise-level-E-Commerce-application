name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    # Setup a fresh Postgres database for integration/E2E tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter & Formatter
        run: pnpm run lint

      - name: Check shared foundation formatting
        run: pnpm run format:check

      - name: Type-Check (TypeScript compiler)
        run: pnpm run type-check

      - name: Migrate Database Schema
        run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://postgres:test_password@localhost:5432/ecommerce_test"
          TEST_DATABASE_URL: "postgresql://postgres:test_password@localhost:5432/ecommerce_test"
          ALLOW_DATABASE_TEST_CLEANUP: '1'

      - name: Run Tests (Vitest)
        run: pnpm run test:vitest
        env:
          DATABASE_URL: "postgresql://postgres:test_password@localhost:5432/ecommerce_test"
          TEST_DATABASE_URL: "postgresql://postgres:test_password@localhost:5432/ecommerce_test"
          ALLOW_DATABASE_TEST_CLEANUP: '1'
          NODE_ENV: test
          JWT_SECRET: temp-secret-key-for-tests

      - name: Measure backend unit coverage
        run: pnpm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: temp-secret-key-for-tests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: coverage/

  build-and-package:
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
